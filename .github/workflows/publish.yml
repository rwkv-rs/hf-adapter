name: publish-to-pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-assets:
    name: Verify immutable validated release assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation tools
        run: python -m pip install "twine==7.0.0"

      - name: Verify release tag matches both package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          root_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          kernel_version = tomllib.loads(pathlib.Path("kernels/pyproject.toml").read_text())["project"]["version"]
          if root_version != kernel_version:
              raise SystemExit(
                  "release requires matching rwkv7-hf and rwkv7-kernels versions: "
                  f"{root_version!r} != {kernel_version!r}"
              )
          expected = f"v{root_version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
          print(f"release version: {root_version}")
          PY

      - name: Download immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist/release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/release

      - name: Verify validated asset identities
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          expected=(
            "rwkv7_hf-${VERSION}-py3-none-any.whl"
            "rwkv7_hf-${VERSION}.tar.gz"
            "rwkv7_kernels-${VERSION}-py3-none-any.whl"
            "rwkv7_kernels-${VERSION}.tar.gz"
            "rwkv7-evidence-rtx-4080-${VERSION}.tar.gz"
            "rwkv7-evidence-rtx-4090-${VERSION}.tar.gz"
            "SHA256SUMS"
            "release-provenance.json"
          )
          for name in "${expected[@]}"; do
            test -f "dist/release/$name" || {
              echo "missing immutable release asset: $name" >&2
              exit 1
            }
          done
          (cd dist/release && sha256sum -c SHA256SUMS)
          python scripts/verify_release_assets.py \
            --directory dist/release \
            --version "$VERSION" \
            --source-sha "$(git rev-parse HEAD)" \
            --require-validation-passed
          # Do not trust the editable summary files alone. Safely unpack both
          # compact GPU bundles, rerun their manifest/report/route validators,
          # and require an exact provenance and checksum rebuild.
          python scripts/build_release_provenance.py \
            --directory dist/release \
            --version "$VERSION" \
            --source-sha "$(git rev-parse HEAD)" \
            --verify-existing
          mkdir -p dist/hf dist/kernels
          cp "dist/release/rwkv7_hf-${VERSION}-py3-none-any.whl" \
             "dist/release/rwkv7_hf-${VERSION}.tar.gz" dist/hf/
          cp "dist/release/rwkv7_kernels-${VERSION}-py3-none-any.whl" \
             "dist/release/rwkv7_kernels-${VERSION}.tar.gz" dist/kernels/

      - name: Check distribution metadata
        run: python -m twine check --strict dist/hf/* dist/kernels/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rwkv7-hf-distributions
          path: dist/hf/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rwkv7-kernels-distributions
          path: dist/kernels/
          if-no-files-found: error
          retention-days: 7

  publish-hf:
    name: Publish rwkv7-hf to PyPI
    # Publish the companion first so rwkv7-hf never names a missing pinned
    # dependency. PyPI cannot atomically publish two projects: if this second
    # upload fails, rwkv7-kernels remains published and this job must be retried
    # with the exact same already-verified rwkv7-hf bytes.
    needs: [verify-assets, publish-kernels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rwkv7-hf
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rwkv7-hf-distributions
          path: dist/hf/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/hf/

  publish-kernels:
    name: Publish rwkv7-kernels to PyPI
    needs: verify-assets
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rwkv7-kernels
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rwkv7-kernels-distributions
          path: dist/kernels/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/kernels/
