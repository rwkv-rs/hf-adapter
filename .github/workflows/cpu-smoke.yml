name: cpu-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: rwkv7-hf --version
      - run: rwkv7-hf convert --help
