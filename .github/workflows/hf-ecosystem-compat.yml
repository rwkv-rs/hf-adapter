name: hf-ecosystem-compat

on:
  pull_request:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transformers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            transformers: "transformers==4.48.3"
          - python: "3.12"
            transformers: "transformers<6"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test]" "${{ matrix.transformers }}"
      - run: python -m pytest -q

  training-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,train]"
      - run: python -m pytest -q tests/test_training_ecosystem.py
