name: hf-ecosystem-compat

# Supported-range gate: exact evidence-backed minimums plus the newest resolver
# result inside the declared Transformers/PEFT/TRL major-version bounds.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: minimum
            python: "3.10"
            constraints: configs/ci/hf-minimum.txt
          - lane: current
            python: "3.12"
            constraints: ""
    name: ${{ matrix.lane }} / py${{ matrix.python }}
    env:
      PYTHON_BIN: python
      RWKV7_CPU_ONLY: "1"
      RWKV7_HF_COMPAT_LANE: ${{ matrix.lane }}
      RWKV7_CONSTRAINTS_FILE: ${{ matrix.constraints }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Clean install and HF ecosystem compatibility gate
        run: scripts/run_clean_install_tests.sh compat
