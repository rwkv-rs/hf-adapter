[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv7-kernels"
version = "1.0.0"
description = "Optional optimized NVIDIA inference, quantization, and diagnostic training leaves for rwkv7-hf"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "123123213weqw", email = "300659282+123123213weqw@users.noreply.github.com" }]
dependencies = [
  "torch",
  "numpy",
  "packaging",
  "ninja",
]

[project.urls]
Repository = "https://github.com/rwkv-rs/hf-adapter"
Issues = "https://github.com/rwkv-rs/hf-adapter/issues"

[tool.setuptools.packages.find]
include = ["rwkv7_kernels*"]

[tool.setuptools.package-data]
rwkv7_kernels = [
  "KERNEL_PLUGIN_API.json",
  "nvidia/CAPABILITY_INVENTORY.json",
  "nvidia/MIGRATION_MANIFEST.json",
  "nvidia/RECURRENT_SOURCE_SCOPE.json",
  "nvidia/SOURCE_SCOPE.json",
  "nvidia/SELF_CHUNK_LICENSE",
  "nvidia/csrc/**/*",
]
