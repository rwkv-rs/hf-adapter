schema_version: 1
contract:
  name: RWKV-7 serving implementation contract
  canonical_repository: https://github.com/rwkv-rs/hf-adapter
  maintainer:
    name: Wang Yue
    github: 123123213weqw
  license: MIT
  human_documentation:
    porting: ../integrations/VLLM_PORTING_GUIDE.md
    operators: ../architecture/RWKV7_OPERATOR_SPEC.md
    state_cache: ../integrations/RWKV7_STATE_CACHE_ABI.md
    quantization: ../quantization/VLLM_QUANTIZATION_PORTING.md
    checkpoint: ../integrations/VLLM_CHECKPOINT_MAPPING.md
    acceptance: ../validation/VLLM_ACCEPTANCE.md

dimensions:
  B: active request rows
  L: layer count
  D: residual hidden size
  H: recurrent head count
  N: head dimension
  A: attention hidden size, equal to H*N
  F: FFN intermediate size

state:
  recurrent:
    logical_shape: [L, B, H, N, N]
    reference_dtype: float32
    sequence_scaled: false
  attention_previous:
    logical_shape: [L, B, D]
    dtype: activation
    sequence_scaled: false
  ffn_previous:
    logical_shape: [L, B, D]
    dtype: activation
    sequence_scaled: false
  v_first:
    logical_shape: [B, A]
    dtype: activation
    lifecycle: current-token cross-layer value, overwritten by layer 0
  seen_tokens:
    logical_shape: [B]
    dtype: int64

token_step:
  reference: rwkv7_hf/native.py
  attention_equation: >-
    S_new = S * decay[...,None,:] + S @ outer(-kk, kk*a) + outer(v,k)
  decay_equation: decay = exp(-exp(-0.5) * sigmoid(w_raw))
  ffn_equation: value(relu(key(mixed_x)) ** 2)
  layer_order: strictly increasing for each token

runtime_operations:
  required:
    - allocate_state_slot
    - reset_state_slot
    - free_state_slot
    - clone_state_slot
    - gather_or_index_scheduled_slots
    - commit_scheduled_slots
    - packed_prefill
    - one_token_decode
    - prefix_snapshot
    - prefix_restore_copy_on_write
  forbidden_assumptions:
    - cache memory grows with sequence length
    - one seen_tokens scalar describes a dynamic batch
    - scheduled row order remains stable
    - recurrent state can be cropped to any earlier positive prefix

quantization_layouts:
  - id: rwkv7.rowwise_w8.v1
    reference: rwkv7_hf/native_quant.py
  - id: rwkv7.rowwise_w4.v1
    reference: rwkv7_hf/native_quant.py
  - id: rwkv7.mm8_affine.v1
    reference: rwkv7_hf/native_quant_mm8.py
  - id: rwkv7.mm4_affine.v1
    reference: rwkv7_hf/native_quant_mm4.py
  - id: rwkv7.dynamic_a8w8.v1
    reference: rwkv7_hf/native_quant_a8w8.py
  - id: rwkv7.sm7x_group_w4.v1
    reference: rwkv7_hf/sm70_quant.py
  - id: rwkv7.marlin_u4b8_bf16.v1
    reference: rwkv7_hf/native_quant_marlin.py

attribution:
  adapter_and_serving_contract: >-
    RWKV-7 Hugging Face Adapter maintained by Wang Yue and project contributors
  upstream_algorithm: BlinkDL/RWKV-LM
  preserve_upstream_notices: true
  preserve_canonical_source_when_deriving: true
