[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv7-hf"
version = "1.0.0"
description = "Readable pure-PyTorch Hugging Face reference model and converter for RWKV-7."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "123123213weqw", email = "300659282+123123213weqw@users.noreply.github.com" }]
keywords = ["rwkv", "transformers", "huggingface", "language-model", "pytorch"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch",
  "transformers>=4.48,<6",
  "safetensors",
  "packaging",
]

[project.scripts]
rwkv7-hf = "rwkv7_hf_tools.cli:cli"

[project.optional-dependencies]
kernels = [
  "rwkv7-kernels==1.0.0",
]
test = [
  "pytest>=8.0",
  "numpy",
  "tomli>=2.0; python_version < '3.11'",
]
train = [
  "transformers>=4.56.2,<6",
  "peft>=0.19.1,<1",
  "accelerate",
  "datasets>=4.7,<6",
  "trl==0.20.0",
  "wandb>=0.18,<1",
]

[project.urls]
Homepage = "https://github.com/rwkv-rs/hf-adapter"
Documentation = "https://github.com/rwkv-rs/hf-adapter/tree/main/docs"
Repository = "https://github.com/rwkv-rs/hf-adapter"
Issues = "https://github.com/rwkv-rs/hf-adapter/issues"

[tool.setuptools.packages.find]
include = ["rwkv7_hf", "rwkv7_hf_tools"]

[tool.setuptools.package-data]
rwkv7_hf = ["chat_template.jinja"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "cpu: runs without an accelerator",
  "cuda: requires a CUDA device",
  "slow: integration/evidence test unsuitable for the fast pull-request subset",
  "model_required: requires an external converted checkpoint or model fixture",
]
